name: Deploy website and wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy run as separate jobs. In one job, deploy-pages can look for the
  # artifact before it is visible and fail with "No artifacts named github-pages"
  # (https://github.com/actions/deploy-pages/issues/451).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/wiki/package-lock.json
      - name: Build the wiki
        working-directory: website/wiki
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run brand:check
          npm run build
      # The site is website/ as it is, with the wiki's static export in place of its source.
      - name: Put the site together
        run: |
          mkdir _site
          rsync -a --exclude /wiki website/ _site/
          cp -R website/wiki/out _site/wiki
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
