name: Checks

# Everything "Before you push" in AGENTS.md lists, on every pull request and every push to main,
# so a broken page, a stale generated page or a drifted brand copy fails before it is merged or
# published.
#
# - repository: the tools' own tests, then nothing personal and no secret in files or commit
#   addresses, the links between the Markdown files, and the website's pages against their
#   generator and the release data kept in the repository. Python 3 only.
# - wiki: the brand copies against the kit, the wiki's tools' tests, each app's section against
#   the app's guide at its recorded commit (read from the app's public repository with git),
#   the wiki's lint, type check and build, and the site put together the way it is published.
#
# The deploy (pages.yml) calls this workflow and publishes the site this run put together, so
# what is published is what was checked. Nothing here has a path filter: a check that always
# reports can be required on main.
#
# One thing differs in a deploy (`publish: true`): the site is built with each app's latest
# release as GitHub gives it at that moment, not with website/data/releases.json. That is how
# the site follows a release without a commit. The pages in the repository are still checked
# against the file in the repository first, so a release never turns this workflow red.
#
# Not here: `project/carry.py --check --remote`. It compares the carried text with what the other
# repositories have published and is red while one of them is behind, so it has its own workflow
# (carried.yml).
#
# Only GitHub's own actions, pinned to full commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: "Upload the site as the artifact the Pages deploy publishes"
        type: boolean
        default: false

permissions:
  contents: read

# Called from pages.yml, `github.workflow` is the deploy's name, so a deploy and a plain run of
# these checks on the same commit never cancel each other.
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository (tools, privacy, links, website pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # privacy reads every commit address
      - name: Test the tools
        run: |
          python3 -m unittest discover -s project -p "test_*.py"
          python3 -m unittest discover -s website/tools -p "test_*.py"
      - name: Nothing personal, no secret, no-reply commit addresses
        env:
          # On a pull request HEAD is GitHub's merge commit; the commits to read are the branch's own.
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 project/privacy.py --head "${PR_HEAD:-HEAD}"
      - name: Links between the Markdown files
        run: python3 project/check_links.py
      - name: The website's pages are what build.py writes
        run: python3 website/tools/build.py --check

  wiki:
    name: wiki and site (brand copies, guide pages, lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/wiki/package-lock.json
      - name: Install
        working-directory: website/wiki
        run: npm ci
      - name: The brand copies match the kit
        working-directory: website/wiki
        run: npm run brand:check
      - name: Test the wiki's tools
        working-directory: website/wiki
        run: npm test
      # Reads each app's guide at the commit recorded in guides.lock.json, from the app's public
      # repository, and compares. It never follows an app's main: a guide that moved on does not
      # fail this run (guides.yml reports that).
      - name: Each app's section is what the app's guide gives
        working-directory: website/wiki
        run: npm run guide:check
      - name: Lint
        working-directory: website/wiki
        run: npm run lint
      - name: Type check
        working-directory: website/wiki
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run types:check
      # A deploy only. The answer is public data and needs no token; the run's own token is sent
      # because requests without one share a small hourly allowance with every other runner at
      # the same address. An app that cannot be read keeps its last known release, from the file
      # the live site was built from, and the step says so.
      - name: Read each app's latest release from GitHub
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 website/tools/releases.py --out "$RUNNER_TEMP/releases.json" --last-known https://wordsmithand.ink/releases.json
          echo "WORDSMITH_RELEASES=$RUNNER_TEMP/releases.json" >> "$GITHUB_ENV"
      - name: Build the wiki
        working-directory: website/wiki
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      # The site is website/ with the wiki's static export in place of its source. The generator,
      # the preview server, the data the pages are built from and the folder's README are for
      # people working on the site: they are not published.
      - name: Put the site together
        run: |
          mkdir _site
          rsync -a --exclude /wiki --exclude /tools --exclude /data --exclude /README.md website/ _site/
          cp -R website/wiki/out _site/wiki
          # The release data the site was built from goes out with it: the scheduled deploy
          # compares it with GitHub to see whether the site is behind. In a deploy the pages are
          # written again from what GitHub has just answered.
          if [ -n "${WORDSMITH_RELEASES:-}" ]; then
            python3 website/tools/build.py _site --releases "$WORDSMITH_RELEASES"
            cp "$WORDSMITH_RELEASES" _site/releases.json
          else
            cp website/data/releases.json _site/releases.json
          fi
          test -f _site/releases.json
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/wiki/index.html
          test ! -e _site/tools
          test ! -e _site/data
          test ! -e _site/README.md
          test ! -e _site/wiki/package.json
      - name: Upload the site for the deploy
        if: ${{ inputs.publish }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
