name: Check the carried blocks

# Some text is carried word for word in several repositories: the project block from
# project/README.md in each app's AGENTS.md, and the core's shared rules here (blocks in AGENTS.md,
# SECURITY.md and CONTRIBUTING.md, and the whole CODE_OF_CONDUCT.md). This compares every
# published copy with its source (each app's main, the core's newest release).
#
# It goes red while a copy is behind. That is the point: after the project block changes here, it
# stays red until every app has taken the new block, and after a core release that changes a
# shared rule it stays red until this repository has taken it. To fix it, follow Route N in
# project/README.md: run `python3 project/carry.py --write` with the repositories side by side,
# then commit and push each one it changed.
#
# The tool's own tests run in checks.yml, on every push and pull request.
#
# Only GitHub's own actions, pinned to full commit SHAs.

on:
  push:
    branches: [main]
    paths:
      - "project/README.md"
      - "project/carry.py"
      - "AGENTS.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - ".github/workflows/carried.yml"
  pull_request:
    paths:
      - "project/README.md"
      - "project/carry.py"
      - "AGENTS.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - ".github/workflows/carried.yml"
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carried-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare every published copy with its source
        run: python3 project/carry.py --check --remote
